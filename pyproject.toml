[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-aware-hedging"
version = "0.1.0"
description = "Regime-aware residual deep hedging under hidden liquidity states."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

